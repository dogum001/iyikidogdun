<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun, Melisa | Özel An</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cinzel:wght@600&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a0a0f;
            --surface: rgba(20, 20, 30, 0.6);
            --border: rgba(255, 255, 255, 0.07);
            --primary: #f43f5e;
            --primary-glow: rgba(244, 63, 94, 0.3);
            --accent: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta+Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Arka Plan Atmosferik Işıklar */
        .ambient-light {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.12) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(60px);
        }

        /* Ana Kart */
        .experience-card {
            position: relative;
            width: 90%;
            max-width: 560px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px var(--primary-glow);
            z-index: 10;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Başlık Bölümü */
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            color: #fff;
        }

        .intro-text {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 32px;
            font-weight: 300;
        }

        /* Etkileşim Butonu */
        .reveal-btn {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4);
            letter-spacing: 0.5px;
        }

        .reveal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(244, 63, 94, 0.6);
        }

        .reveal-btn:active {
            transform: translateY(0);
        }

        /* Açılan İçerik Bölümü */
        .content-hidden {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .content-hidden.active {
            max-height: 400px;
            opacity: 1;
            margin-top: 32px;
        }

        .message-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            text-align: left;
            position: relative;
        }

        .message-box p {
            font-size: 1rem;
            color: #e2e8f0;
            line-height: 1.8;
            font-weight: 300;
        }

        /* Alt Bilgi */
        .footer-note {
            margin-top: 36px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .experience-card {
                padding: 36px 20px;
                width: 92%;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <main class="experience-card">
        <div class="badge">Özel Gün</div>
        <h1>İyi ki Doğdun, Melisa</h1>
        <p class="intro-text">Hayatın boyunca karşına çıkacak tüm güzelliklerin başlangıcı olan bu özel günde, senin için küçük ama anlamlı bir alan bıraktım.</p>
        
        <button class="reveal-btn" id="mainBtn" onclick="revealSurprise()">Sürprizi Keşfet</button>

        <div class="content-hidden" id="surpriseContent">
            <div class="message-box">
                <p id="typedMessage"></p>
            </div>
        </div>

        <div class="footer-note">Kişiye Özel Tasarım</div>
    </main>

    <script>
        const messageText = "Yüzündeki o samimi ve güzel gülümsemenin hayatın boyunca hiç solmamasını dilerim. Hedeflerine ulaştığın, huzur dolu ve unutulmaz anlarla dolu harika bir yaş senin olsun. İyi ki varsın.";
        
        function revealSurprise() {
            const btn = document.getElementById('mainBtn');
            const content = document.getElementById('surpriseContent');
            
            // Butonu yumuşakça devre dışı bırak
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';
            btn.innerText = 'Kutlu Olsun';

            // İçeriği aç
            content.classList.add('active');

            // Daktilo efektini başlat
            let i = 0;
            const target = document.getElementById('typedMessage');
            target.innerHTML = "";

            function typeWriter() {
                if (i < messageText.length) {
                    target.innerHTML += messageText.charAt(i);
                    i++;
                    setTimeout(typeWriter, 35);
                }
            }
            typeWriter();

            // Şık, boğucu olmayan profesyonel konfeti patlaması
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.7 },
                colors: ['#f43f5e', '#fbbf24', '#ffffff', '#fda4af']
            });
        }
    </script>
</body>
</html>
