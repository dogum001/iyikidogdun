<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Melisa! 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Konfeti Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060609;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        /* Arka Planda Süzülen Yıldızlar/Parıltılar */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 101, 132, 0.2) 0%, rgba(10, 10, 20, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        .container {
            position: relative;
            max-width: 620px;
            width: 100%;
            background: rgba(18, 18, 28, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 35px;
            border-radius: 35px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 60px rgba(255, 101, 132, 0.15);
            z-index: 2;
            animation: containerEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerEntrance {
            from { opacity: 0; transform: translateY(50px) scale(0.93); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.4rem;
            color: #ff6584;
            margin-bottom: 20px;
            line-height: 1.6;
            text-shadow: 0 0 25px rgba(255, 101, 132, 0.6);
        }

        p {
            font-size: 1.1rem;
            color: #d0d0de;
            margin-bottom: 30px;
            line-height: 1.8;
            font-weight: 300;
        }

        /* Çiçek Kutusu ve Şok Animasyonu */
        .flower-card {
            display: inline-block;
            padding: 22px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 30px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
            transition: all 0.5s ease;
        }

        .flower-card.active-animation {
            animation: superPulse 1.2s ease-in-out infinite alternate;
            border-color: rgba(255, 209, 102, 0.5);
        }

        @keyframes superPulse {
            0% { transform: scale(1) rotate(0deg); box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 0 20px rgba(255, 101, 132, 0.4); }
            100% { transform: scale(1.1) rotate(2deg); box-shadow: inset 0 0 35px rgba(0,0,0,0.8), 0 0 40px rgba(255, 209, 102, 0.8); }
        }

        .pixel-flower {
            display: inline-grid;
            grid-template-columns: repeat(9, 15px);
            grid-template-rows: repeat(9, 15px);
            gap: 2px;
        }

        .pixel {
            width: 15px;
            height: 15px;
            border-radius: 3px;
            transition: 0.3s;
        }

        .pink { background-color: #ff6584; box-shadow: 0 0 10px rgba(255, 101, 132, 0.8); }
        .light-pink { background-color: #ff8fab; box-shadow: 0 0 8px rgba(255, 143, 171, 0.7); }
        .yellow { background-color: #ffd166; box-shadow: 0 0 12px rgba(255, 209, 102, 0.9); }
        .green { background-color: #06d6a0; box-shadow: 0 0 10px rgba(6, 214, 160, 0.7); }
        .empty { background-color: transparent; }

        .btn {
            background: linear-gradient(135deg, #ff6584, #ff8fab);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(255, 101, 132, 0.5);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 101, 132, 0.7);
            background: linear-gradient(135deg, #ff5273, #ff7b9c);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Daktilo Efektli Şok Edici Mesaj Kutusu */
        #message {
            margin-top: 30px;
            font-size: 1.15rem;
            color: #ffd166;
            display: none;
            padding: 25px;
            background: rgba(255, 209, 102, 0.07);
            border: 1px solid rgba(255, 209, 102, 0.35);
            border-radius: 20px;
            line-height: 1.8;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #message.show {
            display: block;
            transform: scale(1);
            opacity: 1;
        }

        .signature {
            margin-top: 35px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <h1>İyi ki Doğdun<br>Melisa! 🌸</h1>
        <p>Yeni yaşının sana hayatın boyunca unutamayacağın kadar büyük mutluluklar, huzur ve başarı getirmesi dileğiyle. İyi ki varsın!</p>

        <!-- Pixel Art Çiçek Modülü -->
        <div class="flower-card" id="flowerCard">
            <div class="pixel-flower">
                <!-- Satır 1 -->
                <div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel pink"></div><div class="pixel light-pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div>
                <!-- Satır 2 -->
                <div class="pixel empty"></div><div class="pixel pink"></div><div class="pixel light-pink"></div><div class="pixel yellow"></div><div class="pixel light-pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div>
                <!-- Satır 3 -->
                <div class="pixel pink"></div><div class="pixel light-pink"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel light-pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div>
                <!-- Satır 4 -->
                <div class="pixel light-pink"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel light-pink"></div><div class="pixel empty"></div><div class="pixel empty"></div>
                <!-- Satır 5 -->
                <div class="pixel pink"></div><div class="pixel light-pink"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel light-pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div>
                <!-- Satır 6 -->
                <div class="pixel empty"></div><div class="pixel pink"></div><div class="pixel light-pink"></div><div class="pixel yellow"></div><div class="pixel light-pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div>
                <!-- Satır 7 -->
                <div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel pink"></div><div class="pixel light-pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel green"></div><div class="pixel green"></div><div class="pixel empty"></div>
                <!-- Satır 8 -->
                <div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel green"></div><div class="pixel empty"></div><div class="pixel green"></div><div class="pixel green"></div><div class="pixel empty"></div><div class="pixel empty"></div>
                <!-- Satır 9 -->
                <div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel green"></div><div class="pixel green"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div>
            </div>
        </div>

        <br>
        <button class="btn" id="surprizBtn" onclick="tetikleSurpriz()">Sürprizi Aç 🎁</button>
        
        <div id="message">
            <span id="typedText"></span>
        </div>

        <div class="signature">Kişiye Özel Tasarım</div>
    </div>

    <script>
        function tetikleSurpriz() {
            // Butonu gizleyelim ve çiçeği çılgın animasyona sokalım
            const btn = document.getElementById('surprizBtn');
            btn.style.transform = 'scale(0.9)';
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';
            btn.innerText = 'Sürpriz Patlıyor! 🎉';

            // Çiçeği şok animasyonuna sok
            document.getElementById('flowerCard').classList.add('active-animation');

            // Mesaj kutusunu görünür yap ve daktilo efektini başlat
            const msg = document.getElementById('message');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.classList.add('show');
                baslatDaktilo();
            }, 200);

            // Sinematik Havai Fişek Şöleni (4 saniye boyunca ekranı inletir)
            var duration = 4.5 * 1000;
            var animationEnd = Date.now() + duration;

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 70,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#ff6584', '#ffd166', '#06d6a0', '#ff8fab', '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 70,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#ff6584', '#ffd166', '#06d6a0', '#ff8fab', '#ffffff']
                });
            }, 200);

            // Dev İlk Patlama
            confetti({
                particleCount: 150,
                spread: 120,
                origin: { y: 0.6 },
                colors: ['#ff6584', '#ffd166', '#06d6a0', '#ff8fab', '#ffffff']
            });
        }

        // Daktilo Efekti (Yazıyı harf harf yazar)
        function baslatDaktilo() {
            const metin = "✨ Şok mu oldun Melisa? :) Yüzündeki o harika gülümseme ve enerjin etrafındaki herkese ışık olmaya devam etsin. Hayallerine ulaştığın, masallar gibi harika bir yaşın olsun! 🎂🎈";
            let i = 0;
            const hız = 35; // Yazım hızı (milisaniye)
            const hedef = document.getElementById('typedText');
            hedef.innerHTML = "";

            function yazdir() {
                if (i < metin.length) {
                    hedef.innerHTML += metin.charAt(i);
                    i++;
                    setTimeout(yazdir, hız);
                }
            }
            yazdir();
        }
    </script>

</body>
</html>
