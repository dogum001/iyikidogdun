<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Melisa! 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 182, 193, 0.3);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.2);
            z-index: 2;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.5rem;
            color: #ff758c;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        p {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Pixel Art Çiçek Tablosu */
        .pixel-flower {
            display: inline-grid;
            grid-template-columns: repeat(9, 14px);
            grid-template-rows: repeat(9, 14px);
            gap: 1px;
            margin: 20px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .pixel {
            width: 14px;
            height: 14px;
            border-radius: 2px;
        }

        /* Renk Kodları */
        .pink { background-color: #ff758c; box-shadow: inset 0 0 2px rgba(0,0,0,0.3); }
        .yellow { background-color: #ffd700; box-shadow: inset 0 0 2px rgba(0,0,0,0.3); }
        .green { background-color: #4caf50; box-shadow: inset 0 0 2px rgba(0,0,0,0.3); }
        .empty { background-color: transparent; }

        .btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        #message {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ffeb3b;
            display: none;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>İyi ki Doğdun<br>Melisa! 🌸</h1>
        <p>Hayatına neşe, huzur ve rengarenk anlar katması dileğiyle. Doğum günün kutlu olsun!</p>

        <!-- Pixel Art Çiçek Tasarımı -->
        <div class="pixel-flower" id="flower">
            <!-- Satır 1 -->
            <div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div>
            <!-- Satır 2 -->
            <div class="pixel empty"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel yellow"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div>
            <!-- Satır 3 -->
            <div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div>
            <!-- Satır 4 -->
            <div class="pixel pink"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div>
            <!-- Satır 5 -->
            <div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel yellow"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div>
            <!-- Satır 6 -->
            <div class="pixel empty"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel yellow"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div>
            <!-- Satır 7 -->
            <div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel pink"></div><div class="pixel empty"></div><div class="pixel green"></div><div class="pixel green"></div><div class="pixel empty"></div>
            <!-- Satır 8 -->
            <div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel green"></div><div class="pixel empty"></div><div class="pixel green"></div><div class="pixel green"></div><div class="pixel empty"></div><div class="pixel empty"></div>
            <!-- Satır 9 -->
            <div class="pixel empty">` +             `</div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel green"></div><div class="pixel green"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div><div class="pixel empty"></div>
        </div>

        <br>
        <button class="btn" onclick="surprizGoster()">Sürprizi Aç 🎁</button>
        <div id="message">İyi ki varsın Melisa, yüzünden gülücükler hiç eksik olmasın! ✨</div>
    </div>

    <script>
        function surprizGoster() {
            const msg = document.getElementById('message');
            msg.style.display = 'block';
        }
    </script>

</body>
</html>
